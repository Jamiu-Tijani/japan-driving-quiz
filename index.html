<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243d"><title>Japan Road Decision Lab</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;background:#eef3f8;color:#10243d}header{background:#10243d;color:white;padding:24px 18px}header>div,main,footer{max-width:820px;margin:auto}h1{font-size:1.7rem;margin:0}h2{margin:8px 0}p{margin:6px 0 16px}.sub{opacity:.85}main{padding:18px}button,select{font:inherit}button{cursor:pointer;border:1px solid #cbd6e2;border-radius:12px;padding:12px;background:white;color:#10243d}button:hover{border-color:#285bca}button:focus-visible{outline:3px solid #28ad96}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.active{background:#2555be;color:white}section{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #14264212}.muted{color:#56677f}.sign{display:flex;justify-content:center;align-items:center;font-weight:800;margin:22px auto;font-size:clamp(36px,8vw,70px);width:170px;height:170px;max-width:100%;background:#fff;border:10px solid #dc3545;border-radius:30px;text-align:center}.sign.small{width:94px;height:94px;border-width:6px;font-size:34px;margin:0}.options{display:grid;gap:10px;margin:14px 0}.options button{text-align:left}.options .chosen{background:#e8efff;border-color:#2555be}.options button:disabled{cursor:default}.correct{background:#e4f8ec!important;border-color:#188454!important}.wrong{background:#ffe9e8!important;border-color:#c54242!important}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}.primary{background:#2555be;color:white;border-color:#2555be}.feedback{border-left:4px solid #2555be;background:#f1f5fc;padding:12px;border-radius:8px;margin-top:14px}.bar{height:9px;background:#dee6ee;border-radius:12px;overflow:hidden}.fill{height:100%;background:#2555be}.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.item{display:flex;align-items:center;gap:12px;border:1px solid #dce4ed;border-radius:12px;padding:10px}.item b{display:block}.item small{color:#586982}select{padding:10px;border-radius:10px;border:1px solid #b8c6d6;width:100%;max-width:280px}footer{padding:15px 20px 35px;color:#5e6f82;font-size:13px}@media(min-width:560px){.options{grid-template-columns:1fr 1fr}}.sign{border:0;background:#f1f4f8}.official{width:100%;height:100%;object-fit:contain}.unverified{font-size:56px;display:flex;flex-direction:column;align-items:center;line-height:1.2}.unverified small{font-size:10px}.small .unverified{font-size:25px}.small .unverified small{font-size:8px}.roadsvg{display:block;width:100%;max-width:470px;margin:auto;touch-action:none;user-select:none;background:#dbe8d8;border-radius:15px}.feedbackroad{margin-top:15px;padding:12px;background:#edf3fb;border-radius:10px}</style></head><body><header><div><h1>Japan Road Decision Lab</h1><p class="sub">Road signs · allowed routes · vehicles · driving actions</p></div></header><main><nav><button id="quizTab" class="active">Quiz</button><button id="libraryTab">Sign library</button><button id="retryTab">Retry mistakes</button><button id="roadTab">Draw a route</button><button id="historyTab">History</button></nav><div id="app"></div></main><footer>Unofficial study aid. This starter game uses simplified symbols, not exact Japanese regulatory sign artwork. Always confirm rules and exceptions using official Japanese driver materials and supplementary signs.</footer><script>
const data=[["止まれ","STOP","🛑","Stop completely before the stop line, then check safety.",["Stop fully","Slow only","Stop only if cars approach","Sound horn"],0,"action"],["徐行","SLOW","▽","Proceed slowly enough to stop immediately.",["Maintain speed","Proceed at a very low speed","Stop for 10 seconds","Accelerate"],1,"action"],["車両進入禁止","NO ENTRY","⛔","Vehicles must not enter from this direction.",["Enter if clear","Only motorcycles may enter","Do not enter","Enter after stopping"],2,"route"],["一方通行","ONE WAY","⬆️","Traffic may travel only in the arrow's direction (subject to any supplementary plates).",["Drive only in arrow direction","Drive either way","Turn around anywhere","Overtake freely"],0,"route"],["指定方向外進行禁止","STRAIGHT ONLY","⬆","At the intersection, proceed only in the direction indicated.",["Right turn permitted","Left turn permitted","U-turn required","Go straight only"],3,"route"],["指定方向外進行禁止","LEFT TURN ONLY","⬅","Follow the indicated direction at the intersection.",["Straight only","Left turn only","Right turn only","Any direction"],1,"route"],["転回禁止","NO U-TURN","↩️✕","A U-turn is prohibited; other movements are controlled by other signs and rules.",["All turns banned","Only overtaking banned","Do not make a U-turn","Road closed"],2,"route"],["駐車禁止","NO PARKING","🅿️✕","Parking is prohibited; stopping may still be allowed unless another rule prohibits it.",["No parking","No stopping ever","Bus parking only","Parking at night only"],0,"action"],["駐停車禁止","NO STOPPING OR PARKING","✕","Neither stopping nor parking is permitted except where the law provides an exception.",["Parking prohibited but stopping allowed","No stopping or parking","Free parking","Stop for loading"],1,"action"],["最高速度","MAX SPEED 40 km/h","40","Do not exceed the posted maximum speed.",["Minimum speed 40","Recommended speed 40","Maximum speed 40","Speed limit ends"],2,"action"],["自転車及び歩行者専用","BICYCLES AND PEDESTRIANS ONLY","🚲🚶","This path is reserved for bicycles and pedestrians, subject to applicable exceptions.",["Ordinary passenger cars","Large trucks","Motorcycles","Bicycles and pedestrians"],3,"vehicle"],["歩行者専用","PEDESTRIANS ONLY","🚶","Ordinary motor vehicles are not permitted on this pedestrian-only road.",["Pedestrians","Passenger cars","Mopeds","Trucks"],0,"vehicle"],["車両通行止め","ROAD CLOSED TO VEHICLES","🚫🚗","Vehicles are prohibited from using this road, subject to exceptions indicated by law or supplementary plates.",["Any private car can enter","Do not enter with a vehicle","Only trucks can enter","Proceed at 10 km/h"],1,"vehicle"],["大型貨物自動車等通行止め","NO LARGE GOODS VEHICLES","🚚✕","The restriction applies to designated classes of large goods vehicles.",["All pedestrians","Bicycles only","Designated large goods vehicles","All vehicles"],2,"vehicle"],["自動二輪車及び原動機付自転車通行止め","NO MOTORCYCLES / MOPEDS","🏍️✕","Motorcycles and mopeds covered by the sign may not enter.",["Bicycles only","Motorcycles and mopeds","All passenger cars","Pedestrians only"],1,"vehicle"],["追越しのための右側部分はみ出し通行禁止","NO CROSSING RIGHT SIDE TO OVERTAKE","│🟨│","Do not cross into the right-hand side of the road to overtake.",["Cross to overtake","Cross whenever no traffic","Do not cross to overtake","Overtake only at night"],2,"route"],["横断歩道","PEDESTRIAN CROSSING","🚶‍➡️","At a crossing without traffic signals, yield to pedestrians crossing or about to cross; stop as required.",["Accelerate","Yield and stop as required","Sound horn first","Always reverse"],1,"action"],["踏切あり","RAILWAY CROSSING AHEAD","🚆","Approach carefully. At a railway crossing, follow stop-and-safety-check rules unless an applicable exception applies.",["Ignore tracks","Accelerate through","Park on tracks","Prepare to check crossing safety"],3,"action"],["学校、幼稚園、保育所等あり","SCHOOL / CHILDREN AHEAD","🏫","Be alert for children and adjust your driving to conditions.",["Increase vigilance","Assume no pedestrians","Drive at maximum speed","Use the shoulder"],0,"action"],["車線数減少","LANES REDUCE","⇢│","A lane reduction is ahead: prepare to merge safely.",["Accelerate across lines","Stop in all cases","Prepare for a safe merge","Reverse immediately"],2,"route"]];
const official={0:"330-A",2:"303",3:"326-B"};
function img(id,x){return official[id]?'<img class="official" alt="'+x[1]+'" src="https://commons.wikimedia.org/wiki/Special:FilePath/Japan_road_sign_'+official[id]+'.svg">':'<div class="unverified">'+x[2]+'<small>Illustration only</small></div>'}

const STORE_KEY='jrdl.progress.v1';
function readProgress(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY)||'null');return x&&x.schemaVersion===1?x:null}catch(_){return null}}
let saved=readProgress()||{schemaVersion:1,sessions:[],active:null};
function saveProgress(){try{localStorage.setItem(STORE_KEY,JSON.stringify(saved))}catch(e){console.warn('Local progress unavailable',e)}}
function openSession(type,queue){
 const session={id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),type,startedAt:new Date().toISOString(),endedAt:null,questionIds:queue.map(q=>q.id),answers:[],score:0,total:queue.length,completed:false};
 saved.active=session;saveProgress();return session;
}
function recordAnswer(id,choice,correct){
 const a=saved.active;if(!a||a.completed||a.answers.some(x=>x.questionId===id))return;
 a.answers.push({questionId:id,chosen:choice,correct,at:new Date().toISOString()});a.score=a.answers.filter(x=>x.correct).length;saveProgress();
}
function closeSession(){const a=saved.active;if(!a||a.completed)return;a.completed=true;a.endedAt=new Date().toISOString();saved.sessions.unshift({...a});saved.sessions=saved.sessions.slice(0,100);saved.active=null;saveProgress()}
function historyView(){
 const past=saved.sessions;
 app.innerHTML='<section><h2>Learning history</h2><p class="muted">Stored only in this browser on this device. No account or server sync.</p><p><b>'+past.length+'</b> completed sessions · <b>'+past.reduce((n,x)=>n+x.answers.length,0)+'</b> recorded answers</p>'+ (saved.active?'<p>In-progress quiz: '+saved.active.answers.length+' of '+saved.active.total+' answered</p>':'')+'<div class="options">'+past.slice(0,20).map(x=>'<div class="item"><div><b>'+esc(x.type)+' · '+x.score+' / '+x.total+'</b><small>'+esc(new Date(x.startedAt).toLocaleString())+'</small></div></div>').join('')+'</div><button id="clearHistory">Clear saved history</button></section>';
 document.getElementById('clearHistory').onclick=()=>{if(!confirm('Delete saved quizzes and scores on this browser?'))return;saved={schemaVersion:1,sessions:[],active:null};saveProgress();historyView()};
}
function resumeSession(){
 const a=saved.active;if(!a||a.completed)return false;
 const q=a.questionIds.map(id=>({id,item:data[id]})).filter(o=>o.item);
 if(!q.length)return false;
 questions=q;mode=a.type==='retry'?'retry':'quiz';filter='all';index=a.answers.length;score=a.score;
 wrong=new Set(a.answers.filter(x=>!x.correct).map(x=>x.questionId));
 return true;
}

let questions=[],index=0,score=0,wrong=new Set(),locked=false,mode='quiz',filter='all';
const app=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tabs(){['quizTab','libraryTab','retryTab','roadTab','historyTab'].forEach((id,i)=>document.getElementById(id).classList.toggle('active',['quiz','library','retry','road','history'][i]===mode))}
function start(retry=false){mode=retry?'retry':'quiz';const base=retry?[...wrong].map(i=>({item:data[i],id:i})):data.map((item,id)=>({item,id}));questions=base.filter(x=>filter==='all'||x.item[6]===filter).sort(()=>Math.random()-.5);index=0;score=0;wrong.clear();openSession(mode,questions);tabs();render()}
function render(){if(mode==='history'){historyView();return}if(mode==='library'){library();return}if(mode==='road'){road();return}if(!questions.length){app.innerHTML='<section><h2>No questions yet</h2><p>Complete a quiz first to collect mistakes, or change your topic filter.</p><button class="primary" onclick="start()">Start full quiz</button></section>';return}
if(index>=questions.length){closeSession();app.innerHTML='<section><h2>Quiz completed</h2><h1>'+score+' / '+questions.length+'</h1><p>'+Math.round(100*score/questions.length)+'% answered correctly on first attempt.</p><div class="actions"><button class="primary" onclick="start()">New quiz</button><button onclick="review()">Review mistakes ('+wrong.size+')</button></div></section>';return}
locked=false;const {item,id}=questions[index], [jp,name,symbol,explain,options,answer]=item;
app.innerHTML='<section><p class="muted">Question '+(index+1)+' of '+questions.length+' · '+item[6]+'</p><div class="bar"><div class="fill" style="width:'+100*index/questions.length+'%"></div></div><div class="sign" role="img" aria-label="'+esc(name)+'">'+img(id,item)+'</div><h2>'+esc(name)+'</h2><p class="muted">'+esc(jp)+'</p><p><b>What does this sign require or permit?</b></p><div class="options">'+options.map((x,i)=>'<button data-answer="'+i+'">'+esc(x)+'</button>').join('')+'</div><div id="explain" aria-live="polite"></div><div class="actions"><span class="muted">Score: '+score+'</span><button class="primary" id="next" style="display:none">Next →</button></div></section>';
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const chosen=+b.dataset.answer;if(chosen===answer)score++;else wrong.add(questions[index].id);recordAnswer(id,chosen,chosen===answer);document.querySelectorAll('[data-answer]').forEach(v=>{v.disabled=true;if(+v.dataset.answer===answer)v.classList.add('correct');else if(+v.dataset.answer===chosen)v.classList.add('wrong')});document.getElementById('explain').innerHTML='<div class="feedback"><b>'+(chosen===answer?'Correct':'Not quite')+'</b><p>'+esc(explain)+'</p></div>';let n=document.getElementById('next');n.style.display='inline-block';n.onclick=()=>{index++;render()}})}
function review(){const ids=[...wrong];mode='retry';questions=ids.map(id=>({item:data[id],id})).sort(()=>Math.random()-.5);index=0;score=0;wrong.clear();openSession('retry',questions);tabs();render()}
function library(){app.innerHTML='<section><h2>Sign library</h2><p class="muted">Simplified learning icons; these are not reproductions of official road signs.</p><label>Topic <select id="topic"><option value="all">All topics</option><option value="route">Routes</option><option value="vehicle">Vehicles</option><option value="action">Actions</option></select></label><div id="cards" class="catalog"></div></section>';document.getElementById('topic').value=filter;document.getElementById('topic').onchange=e=>{filter=e.target.value;cards()};cards()}
function cards(){document.getElementById('cards').innerHTML=data.map((x,id)=>({x,id})).filter(o=>filter==='all'||o.x[6]===filter).map(({x,id})=>'<div class="item"><div class="sign small">'+img(id,x)+'</div><div><b>'+esc(x[1])+'</b><small>'+esc(x[0])+'</small><p class="muted" style="font-size:12px">'+esc(x[3])+'</p></div></div>').join('')}
document.getElementById('quizTab').onclick=()=>{filter='all';start()};document.getElementById('libraryTab').onclick=()=>{mode='library';tabs();render()};document.getElementById('retryTab').onclick=()=>review();document.getElementById('roadTab').onclick=()=>{mode='road';tabs();render()};document.getElementById('historyTab').onclick=()=>{mode='history';tabs();render()};if(resumeSession()){tabs();render()}else start();

const situations=[
{name:"No entry",code:"303",desc:"A No Entry sign faces you at the entrance to the road ahead. Draw a route to the left or right instead.",allowed:["left","right"]},
{name:"Stop",code:"330-A",desc:"A STOP sign faces you. Draw a route, then consider what you must do before crossing the stop line.",allowed:["left","right","straight"],stop:true},
{name:"One-way",code:"326-B",desc:"This sign indicates the permitted direction of travel along the signed road, not necessarily a ban on turning at the intersection. Explore different exits.",allowed:["straight","left","right"],note:"The one-way rule controls traffic direction on the signed road. Whether each turn is allowed depends on further signs, signals and road layout."}
];let sit=0;
function road(){
const s=situations[sit];
app.innerHTML='<section><h2>Draw the allowed route</h2><p><img alt="'+s.name+'" style="width:74px;height:75px;object-fit:contain;vertical-align:middle;margin-right:12px" src="https://commons.wikimedia.org/wiki/Special:FilePath/Japan_road_sign_'+s.code+'.svg"><b>'+s.name+'</b></p><p>'+s.desc+'</p><svg id="roads" class="roadsvg" viewBox="0 0 360 360"><rect width="360" height="360" fill="#dce8d6"/><path d="M126 0H234V360H126Z M0 112H360V224H0Z" fill="#79828a"/><path d="M180 0V112 M180 224V360 M0 168H126 M234 168H360" stroke="#e9dd84" stroke-width="3" stroke-dasharray="12 9"/><rect x="146" y="302" width="26" height="43" rx="6" fill="#1b5791" stroke="white" stroke-width="2"/><path d="M159 300l-8 14h16z" fill="#fff"/><path id="route" d="" fill="none" stroke="#38e19b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g font-size="12" font-family="system-ui" font-weight="bold"><text x="8" y="104">LEFT</text><text x="285" y="104">RIGHT</text><text x="185" y="23">STRAIGHT</text></g></svg><div class="feedbackroad" id="roadFeedback">Draw from the blue car at the bottom to an exit. Finger or mouse supported.</div><div class="actions"><button id="erase">Clear</button><button class="primary" id="nextRoad">Next scenario →</button></div><p class="muted">Prototype: evaluates the exit you choose, not complete driving legality. Sign applicability, lane positioning, stops and yielding will be added after source verification.</p></section>';
const svg=document.getElementById('roads'),line=document.getElementById('route');let points=[],down=false;
const get=e=>{const b=svg.getBoundingClientRect();return {x:(e.clientX-b.left)*360/b.width,y:(e.clientY-b.top)*360/b.height}};
svg.onpointerdown=e=>{down=true;points=[{x:159,y:303}];svg.setPointerCapture(e.pointerId)};
svg.onpointermove=e=>{if(!down)return;points.push(get(e));line.setAttribute('d',points.map((p,i)=>(i?'L':'M')+Math.round(p.x)+' '+Math.round(p.y)).join(' '))};
svg.onpointerup=e=>{if(!down)return;down=false;points.push(get(e));const p=points.at(-1);const exit=p.x<80&&p.y>100&&p.y<230?'left':p.x>280&&p.y>100&&p.y<230?'right':p.y<75&&p.x>115&&p.x<245?'straight':null;document.getElementById('roadFeedback').textContent=!exit?'Finish the path at a labelled exit.':s.stop?'You chose '+exit+'. You must STOP completely at the stop line before proceeding, and check that it is safe.':s.allowed.includes(exit)?'Allowed exit in this simplified scenario: '+exit+'. '+(s.note||'Other road rules still apply.'):'Not permitted in this scenario: '+exit+'. '+(s.note||s.desc)};
document.getElementById('erase').onclick=()=>{points=[];line.setAttribute('d','');document.getElementById('roadFeedback').textContent='Draw another route.'};
document.getElementById('nextRoad').onclick=()=>{sit=(sit+1)%situations.length;road()};
}
</script></body></html>
